name: Science Lessons Visual Review

on:
  push:
    branches:
      - codex/science-lessons-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: science-lessons-visual-review-latest
  cancel-in-progress: true

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Science Lessons integration
        uses: actions/checkout@v4
        with:
          ref: codex/science-lessons-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Launch local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > science-preview.log 2>&1 &
          echo $! > science-preview.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/science-lessons.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat science-preview.log
          exit 1

      - name: Capture public Science Lessons review screens
        run: |
          node scripts/science-lessons/capture-visual-review.mjs \
            --base-url http://127.0.0.1:4173 \
            --out-dir science-visual-review

      - name: Stop local preview
        if: always()
        run: |
          if [ -f science-preview.pid ]; then
            kill "$(cat science-preview.pid)" 2>/dev/null || true
          fi

      - name: Publish latest visual review branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f science-visual-review/manifest.json
          test -f science-visual-review/contact-sheet.png

          mkdir publish
          cp -R science-visual-review/. publish/
          cd publish

          git init
          git checkout -b science-visual-review-latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Science Lessons visual review artifacts"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:science-visual-review-latest

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: science-lessons-visual-review
          path: science-visual-review
          if-no-files-found: error
          retention-days: 14
