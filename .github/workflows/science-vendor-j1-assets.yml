name: Vendor J1 Premium Images

on:
  push:
    branches:
      - science-live-preview
    paths:
      - '.github/workflows/science-vendor-j1-assets.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science-live-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Download reliable teaching images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/j1-source public/science-lessons/j1-opening
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://c.pxhere.com/photos/9d/0a/painted_turtles_marsh_turtle_reptile_nature_water_wetland_animal-1180844.jpg!d' -o /tmp/j1-source/pond.jpg
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Polar%20bear%20on%20sea%20ice%20%2852791040875%29.jpg' -o /tmp/j1-source/polar.jpg
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Addo%20elephants%20at%20the%20watering%20hole.jpg' -o /tmp/j1-source/elephants.jpg
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/IMG%20Coral%20reef%20fish.jpg' -o /tmp/j1-source/coral.jpg
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Brown%20Bear%20in%20Stream.jpg' -o /tmp/j1-source/bear.jpg
          curl -L --fail --retry 3 --user-agent 'Mozilla/5.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Common%20wolf%20wading%20in%20water%20-%20DPLA%20-%2019fe94c052ab92c6885934f2de2d90f4.jpg' -o /tmp/j1-source/wolf.jpg
      - name: Optimise for classroom presentation
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src=Path('/tmp/j1-source')
          out=Path('public/science-lessons/j1-opening')
          specs={
            'pond.jpg':'pond.webp',
            'polar.jpg':'polar.webp',
            'elephants.jpg':'elephants.webp',
            'coral.jpg':'coral.webp',
            'bear.jpg':'bear-stream.webp',
            'wolf.jpg':'wolf-stream.webp',
          }
          for source,target in specs.items():
            im=Image.open(src/source).convert('RGB')
            im=ImageOps.exif_transpose(im)
            im.thumbnail((2200,1600),Image.Resampling.LANCZOS)
            im.save(out/target,'WEBP',quality=86,method=6)
          PY
      - name: Add provenance
        run: |
          cat > public/science-lessons/j1-opening/README.md <<'EOF'
          # J1 Opening visual assets
          
          Curriculum source: Copy of J1 PPT.pptx.
          
          Visual assets are localised for reliable classroom playback:
          - pond.webp — PxHere, CC0/Public Domain, photo 1180844.
          - polar.webp — USFWS / Wikimedia Commons, public domain: Polar bear on sea ice (52791040875).jpg.
          - elephants.webp — Amanda Hawker / Wikimedia Commons, CC BY-SA 4.0: Addo elephants at the watering hole.jpg.
          - coral.webp — Wikimedia Commons: IMG Coral reef fish.jpg (see source file page for license/attribution).
          - bear-stream.webp — Steve Hillebrand / USFWS / Wikimedia Commons, public domain: Brown Bear in Stream.jpg.
          - wolf-stream.webp — Warren Garst / DPLA / Wikimedia Commons: Common wolf wading in water - DPLA - 19fe94c052ab92c6885934f2de2d90f4.jpg.
          
          These images enhance the authoritative PPT teaching sequence; they do not replace or reorder its content.
          EOF
      - name: Commit assets to preview branch
        run: |
          git config user.name "science-preview-bot"
          git config user.email "science-preview-bot@users.noreply.github.com"
          git add public/science-lessons/j1-opening
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor reliable J1 premium lesson images [skip ci]"
          git push origin HEAD:science-live-preview
