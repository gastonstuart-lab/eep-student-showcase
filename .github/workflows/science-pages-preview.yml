name: Science Lessons GitHub Pages Preview

on:
  push:
    branches:
      - science-live-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: science-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for GitHub Pages
        run: |
          npx tsc -b
          npx vite build --base=/eep-student-showcase/
          find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -print0 | xargs -0 sed -i 's#"/science-lessons/#"/eep-student-showcase/science-lessons/#g; s#url(/science-lessons/#url(/eep-student-showcase/science-lessons/#g'
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: science-preview-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
