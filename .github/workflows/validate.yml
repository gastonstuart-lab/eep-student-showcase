name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Install functions
        run: npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Functions lint
        run: npm --prefix functions run lint

      - name: Unit tests
        run: npm test

      - name: Functions tests
        run: npm --prefix functions test

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Production build
        run: npm run build

      - name: Functions build
        run: npm --prefix functions run build

      - name: Install Chromium for authenticated browser checks
        run: npx playwright install --with-deps chromium

      - name: Build emulator-connected app
        env:
          VITE_FIREBASE_API_KEY: demo-api-key
          VITE_FIREBASE_AUTH_DOMAIN: eep-student-showcase.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: eep-student-showcase
          VITE_FIREBASE_APP_ID: 1:123456789:web:studio-test
          VITE_FIREBASE_STORAGE_BUCKET: eep-student-showcase.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: 123456789
          VITE_USE_FIREBASE_EMULATORS: 'true'
          VITE_FIREBASE_EMULATOR_HOST: 127.0.0.1
          VITE_FIREBASE_AUTH_EMULATOR_PORT: 9099
          VITE_FIRESTORE_EMULATOR_PORT: 8080
          VITE_FUNCTIONS_EMULATOR_PORT: 5001
        run: npm run build

      - name: Start Firebase emulators
        run: |
          npx firebase emulators:start --only auth,firestore,functions > firebase-emulators.log 2>&1 &
          for i in {1..90}; do
            if bash -c '</dev/tcp/127.0.0.1/9099' 2>/dev/null \
              && bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null \
              && bash -c '</dev/tcp/127.0.0.1/5001' 2>/dev/null; then
              sleep 3
              exit 0
            fi
            sleep 2
          done
          cat firebase-emulators.log
          exit 1

      - name: Seed temporary local owner
        env:
          LOCAL_OWNER_PASSWORD: TempStudio-${{ github.run_id }}-${{ github.run_attempt }}
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GCLOUD_PROJECT: eep-student-showcase
        run: npm --prefix functions run seed:owner:local

      - name: Staff lifecycle emulator smoke
        env:
          LOCAL_OWNER_PASSWORD: TempStudio-${{ github.run_id }}-${{ github.run_attempt }}
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
          GCLOUD_PROJECT: eep-student-showcase
        run: npm --prefix functions run smoke:local

      - name: Verify staff lifecycle and audit records
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GCLOUD_PROJECT: eep-student-showcase
        run: node functions/scripts/verifyLocalStaffSmoke.mjs

      - name: Authenticated admin and studio browser checks
        env:
          ROUTE_SCROLL_ADMIN_USERNAME: stuart
          ROUTE_SCROLL_ADMIN_PASSWORD: TempStudio-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:route-scroll > route-scroll.log 2>&1

      - name: Upload authenticated browser test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-studio-browser-logs
          path: route-scroll.log
          if-no-files-found: ignore

      - name: Upload emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-studio-emulator-logs
          path: firebase-emulators.log
          if-no-files-found: ignore
