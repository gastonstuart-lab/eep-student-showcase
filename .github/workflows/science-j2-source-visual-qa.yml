name: J2 Source Visual QA

on:
  push:
    branches:
      - science-live-preview
    paths:
      - 'src/science-lessons/J2OpeningLessonPlayer.tsx'
      - 'src/science-lessons/j2OpeningLessonPlayer.css'
      - 'src/science-lessons/ScienceLessonsApp.tsx'
      - 'src/science-lessons/curriculum/j2/openingLessons.ts'
      - '.github/workflows/science-j2-source-visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: science-j2-source-visual-qa
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/j2-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/science-lessons.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/j2-preview.log
          exit 1

      - name: Capture J2 source opening
        run: |
          mkdir -p j2-source-qa
          cat > capture-j2.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}, deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173/science-lessons.html', {waitUntil:'networkidle'});
          await page.getByRole('button',{name:/Browse lesson library/i}).click();
          await page.getByRole('button',{name:'J2'}).click();

          const heading = page.getByRole('heading',{name:/Chapter 1.*Section 1.*Elements and Atoms/i});
          const row = heading.locator('xpath=ancestor::article');
          await row.getByRole('button',{name:'Present lesson'}).click();
          await page.locator('.j2-source-player').waitFor();
          await page.waitForTimeout(600);

          if (!(await page.locator('.j2-source-player').evaluate((el) => el.classList.contains('j2-source-player--motion')))) {
            throw new Error('J2 source lesson should start with motion enabled');
          }

          async function showAllReveals(){
            const status = (await page.locator('.j2-source-nav span').innerText()).trim();
            const match = status.match(/Reveal\s+(\d+)\/(\d+)/i);
            if (!match) return;
            const current = Number(match[1]);
            const total = Number(match[2]);
            for (let i = current; i < total; i += 1) {
              await page.keyboard.press('ArrowRight');
              await page.waitForTimeout(80);
            }
          }

          async function snap(index, label){
            await showAllReveals();
            await page.waitForTimeout(280);
            const counter = (await page.locator('.j2-source-topline span').innerText()).trim();
            if (!counter.includes('Slide ' + index + '/15')) throw new Error('Unexpected source position before screenshot: ' + counter);
            await page.screenshot({path:'j2-source-qa/' + String(index).padStart(2,'0') + '-' + label + '.png', fullPage:true});
          }

          const labels = [
            'chapter-title',
            'section-title',
            'question-building-blocks',
            'matter-elements',
            'compound-mixture',
            'particles-atomos',
            'question-atomic-theory',
            'theory-models',
            'dalton',
            'thomson-electrons',
            'rutherford-nucleus',
            'bohr-orbits',
            'electron-cloud',
            'modern-atom-chadwick',
            'models-summary'
          ];

          const requiredVisuals = [
            '.j2-source-visual--chapter',
            '.j2-source-visual--section',
            '.j2-source-visual--question-matter',
            '.j2-source-visual--matter-elements',
            '.j2-source-visual--compare',
            '.j2-source-visual--atomos',
            '.j2-source-visual--question-history',
            '.j2-source-visual--theory',
            '.j2-dalton-model',
            '.j2-thomson-model',
            '.j2-atom-model--rutherford',
            '.j2-atom-model--bohr',
            '.j2-atom-model--cloud',
            '.j2-atom-model--modern',
            '.j2-source-visual--modern-summary'
          ];

          for (let index = 1; index <= 15; index += 1) {
            await page.locator(requiredVisuals[index - 1]).waitFor({state:'visible'});
            await snap(index, labels[index - 1]);
            if (index < 15) {
              await page.keyboard.press('ArrowRight');
              await page.waitForTimeout(120);
            }
          }

          await page.getByRole('button',{name:/Open teacher tools/i}).click();
          await page.screenshot({path:'j2-source-qa/16-teacher-tools.png', fullPage:true});
          await page.getByRole('button',{name:/中文 support/i}).click();
          await page.locator('.j2-source-chinese').waitFor({state:'visible'});
          const zhText = (await page.locator('.j2-source-chinese').innerText()).trim();
          if (zhText.length < 4) throw new Error('Traditional Chinese support did not render');
          await page.screenshot({path:'j2-source-qa/17-chinese-support.png', fullPage:true});

          await page.getByRole('button',{name:/Toggle full screen/i}).click();
          await page.waitForTimeout(250);
          if (!(await page.locator('.j2-source-player').evaluate((el) => el.classList.contains('j2-source-player--fullscreen')))) {
            throw new Error('J2 fullscreen state did not activate');
          }
          await page.screenshot({path:'j2-source-qa/18-fullscreen-state.png', fullPage:true});

          await browser.close();
          EOF
          node capture-j2.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: j2-source-visual-qa
          path: j2-source-qa
          retention-days: 7
