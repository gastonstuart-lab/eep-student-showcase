name: Science Courseware Final Preview

on:
  push:
    branches:
      - codex/science-courseware-final-production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: science-courseware-final-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build branch preview
        run: |
          npx tsc -b
          npx vite build --base=/eep-student-showcase/
          find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -print0 | xargs -0 sed -i 's#"/science-lessons/#"/eep-student-showcase/science-lessons/#g; s#url(/science-lessons/#url(/eep-student-showcase/science-lessons/#g'
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: science-courseware-final-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy review preview only
        id: deployment
        uses: actions/deploy-pages@v4
