<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IED Fluid Glass Intro Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07111d; }
    button { font: inherit; }
    .intro { position: relative; width: 100%; height: 100%; isolation: isolate; background: #07111d; }
    .scene { position: absolute; inset: -4%; background-image: linear-gradient(180deg, rgba(3,10,19,.12), rgba(3,10,19,.72)), url('/images/ied-premium/workspace/luce-chapel-hero.webp'); background-size: cover; background-position: center; transform: scale(1.04); animation: settle 6s cubic-bezier(.2,.8,.2,1) forwards; }
    .scene::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 36%, transparent 0 26%, rgba(3,10,19,.18) 58%, rgba(3,10,19,.58) 100%); }
    .glass-field { position: absolute; inset: 0; overflow: hidden; pointer-events: none; filter: saturate(1.18); }
    .glass { position: absolute; border: 1px solid rgba(255,255,255,.3); background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.055)); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -18px 50px rgba(21,96,142,.15), 0 30px 90px rgba(0,0,0,.32); backdrop-filter: blur(12px) saturate(1.45); -webkit-backdrop-filter: blur(12px) saturate(1.45); transform: translate3d(var(--x, 0px), var(--y, 0px), 0) rotate(var(--r)); transition: transform 900ms cubic-bezier(.2,.8,.2,1); }
    .g1 { width: 52vw; height: 52vw; min-width: 440px; min-height: 440px; left: -14vw; top: -14vw; border-radius: 43% 57% 61% 39% / 42% 39% 61% 58%; --r: 13deg; animation: drift1 8s ease-in-out infinite alternate; }
    .g2 { width: 42vw; height: 56vw; min-width: 360px; min-height: 500px; right: -12vw; top: 10vh; border-radius: 59% 41% 38% 62% / 49% 64% 36% 51%; --r: -11deg; animation: drift2 9s ease-in-out infinite alternate; }
    .g3 { width: 46vw; height: 24vw; min-width: 420px; min-height: 210px; left: 28vw; bottom: -13vw; border-radius: 62% 38% 48% 52% / 58% 48% 52% 42%; --r: 4deg; animation: drift3 7s ease-in-out infinite alternate; }
    .content { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px; text-align: center; }
    .lockup { max-width: 900px; opacity: 0; transform: translateY(22px); animation: reveal .9s 1.1s cubic-bezier(.2,.8,.2,1) forwards; text-shadow: 0 3px 30px rgba(0,0,0,.65); }
    .eyebrow { margin: 0 0 14px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; font-size: clamp(.75rem, 1vw, .95rem); color: rgba(255,255,255,.82); }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 6.5rem); line-height: .95; letter-spacing: -.055em; font-weight: 780; }
    .zh { margin: 18px 0 0; font-size: clamp(1.3rem, 2.8vw, 2.45rem); letter-spacing: .13em; font-weight: 600; }
    .tagline { margin: 30px 0 0; font-size: clamp(1rem, 1.7vw, 1.35rem); color: rgba(255,255,255,.84); }
    .actions { margin-top: 34px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .enter, .skip { border-radius: 999px; padding: 12px 20px; cursor: pointer; }
    .enter { color: #07111d; background: rgba(255,255,255,.94); border: 1px solid white; font-weight: 750; box-shadow: 0 12px 34px rgba(0,0,0,.28); }
    .skip { color: white; background: rgba(4,15,27,.24); border: 1px solid rgba(255,255,255,.36); backdrop-filter: blur(8px); }
    .hint { position: absolute; left: 50%; bottom: 24px; z-index: 4; transform: translateX(-50%); margin: 0; font-size: .8rem; color: rgba(255,255,255,.62); white-space: nowrap; }
    .intro.exiting { animation: exit .75s cubic-bezier(.7,0,.3,1) forwards; }
    .intro.exiting .glass { transform: translate3d(0,-115vh,0) scale(1.15) rotate(0deg); transition-duration: .75s; }
    .intro.exiting .lockup { opacity: 0; transform: translateY(-18px); transition: .45s ease; }
    .next-screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 30px; background: linear-gradient(145deg,#f5f7fa,#dce8f1); color: #10243a; text-align: center; opacity: 0; pointer-events: none; }
    .next-screen.show { opacity: 1; transition: opacity .7s ease; }
    .next-screen h2 { font-size: clamp(2rem,5vw,4rem); margin: 0 0 12px; }
    @keyframes settle { from { filter: blur(9px); transform: scale(1.1); } to { filter: blur(0); transform: scale(1.04); } }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes drift1 { to { translate: 5vw 4vh; rotate: 5deg; } }
    @keyframes drift2 { to { translate: -5vw -3vh; rotate: -4deg; } }
    @keyframes drift3 { to { translate: -3vw -5vh; rotate: 3deg; } }
    @keyframes exit { to { opacity: 0; visibility: hidden; } }
    @media (max-width: 700px) { .g1 { left: -48vw; top: -18vw; } .g2 { right: -52vw; } .g3 { left: 0; } .tagline { margin-top: 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .glass { display: none; } }
  </style>
</head>
<body>
  <main>
    <section class="next-screen" id="nextScreen" aria-hidden="true">
      <div><h2>IED Learning Hub</h2><p>This represents the homepage appearing beneath the intro.</p></div>
    </section>
    <section class="intro" id="intro" aria-label="IED opening introduction">
      <div class="scene" aria-hidden="true"></div>
      <div class="glass-field" aria-hidden="true"><div class="glass g1"></div><div class="glass g2"></div><div class="glass g3"></div></div>
      <div class="content"><div class="lockup">
        <p class="eyebrow">THUHS · International Education</p>
        <h1>International<br>Education Department</h1>
        <p class="zh" lang="zh-Hant">國際教育處</p>
        <p class="tagline">Explore. Create. Connect. &nbsp; 探索・創造・連結</p>
        <div class="actions"><button class="enter" id="enter">Enter the IED Hub</button><button class="skip" id="replay">Replay movement</button></div>
      </div></div>
      <p class="hint">Move your mouse or finger to disturb the glass</p>
    </section>
  </main>
  <script>
    const intro = document.getElementById('intro');
    const next = document.getElementById('nextScreen');
    const glasses = [...document.querySelectorAll('.glass')];
    const move = (clientX, clientY) => {
      const nx = clientX / innerWidth - .5, ny = clientY / innerHeight - .5;
      glasses.forEach((el, i) => { const strength = 18 + i * 9; el.style.setProperty('--x', `${nx * strength}px`); el.style.setProperty('--y', `${ny * strength}px`); });
    };
    addEventListener('pointermove', e => move(e.clientX, e.clientY), { passive: true });
    document.getElementById('enter').addEventListener('click', () => { intro.classList.add('exiting'); next.classList.add('show'); next.setAttribute('aria-hidden','false'); });
    document.getElementById('replay').addEventListener('click', () => { glasses.forEach(el => { el.getAnimations().forEach(a => { a.cancel(); a.play(); }); }); });
  </script>
</body>
</html>
