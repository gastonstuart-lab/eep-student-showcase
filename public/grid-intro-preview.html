<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IED Intro Grid Preview</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#07111d}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d} button{font:inherit}
    .stage{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 40%,#17354c 0,#091521 44%,#050b12 100%)}
    .grid-wrap{position:absolute;left:50%;top:50%;width:150vw;height:118vh;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .8s ease;will-change:transform}
    .grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,1fr);gap:1.15vw;padding:1vw}
    .tile{position:relative;overflow:hidden;border-radius:clamp(8px,1vw,18px);background:#183145;box-shadow:0 15px 35px rgba(0,0,0,.34);transform:translate3d(var(--tx,0),var(--ty,0),0);transition:transform .9s cubic-bezier(.16,1,.3,1),filter .8s ease,opacity .8s ease;will-change:transform}
    .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,8,15,.04),rgba(2,8,15,.25));pointer-events:none}
    .tile img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.1);transition:transform 1.1s cubic-bezier(.16,1,.3,1),filter .8s ease}
    .tile:nth-child(3n){translate:0 -3vh}.tile:nth-child(4n){translate:0 4vh}.tile:nth-child(5n){translate:0 -5vh}
    .tile.hero{z-index:3;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.18)}
    .veil{position:absolute;inset:0;z-index:4;background:radial-gradient(circle at center,rgba(3,12,20,.03),rgba(3,12,20,.34) 54%,rgba(3,12,20,.68) 100%);pointer-events:none;transition:opacity .65s ease}
    .brand{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;text-align:center;pointer-events:none}
    .brand-card{width:min(680px,82vw);padding:clamp(24px,3.2vw,38px) clamp(24px,4vw,46px);border:1px solid rgba(255,255,255,.18);border-radius:24px;background:linear-gradient(145deg,rgba(4,16,28,.38),rgba(10,37,56,.18));box-shadow:0 24px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(9px) saturate(1.18);-webkit-backdrop-filter:blur(9px) saturate(1.18);opacity:0;transform:translateY(24px) scale(.98);animation:brandIn 1s .65s cubic-bezier(.16,1,.3,1) forwards;pointer-events:auto}
    h1{margin:0;font-size:clamp(2rem,4.25vw,4.35rem);line-height:.98;letter-spacing:-.045em;text-wrap:balance;text-shadow:0 7px 30px rgba(0,0,0,.42)}
    .zh{margin:14px 0 0;font-size:clamp(1.1rem,2vw,1.75rem);letter-spacing:.13em;font-weight:650}
    .enter{margin-top:23px;padding:10px 19px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(247,251,255,.96);color:#0a1d2c;font-size:.92rem;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .2s ease,box-shadow .2s ease}.enter:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(0,0,0,.38)}
    .note{position:absolute;z-index:6;left:50%;bottom:20px;transform:translateX(-50%);font-size:.76rem;color:rgba(255,255,255,.54);white-space:nowrap}
    .home{position:fixed;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:linear-gradient(145deg,#f6f8fb,#dbe8f2);color:#10243a;opacity:0;pointer-events:none}.home.show{opacity:1;transition:opacity .75s .35s ease}.home h2{margin:0 0 10px;font-size:clamp(2.2rem,5vw,4.6rem)}
    .stage.entering .brand-card{opacity:0;transform:scale(.9);transition:.45s ease}.stage.entering .veil{opacity:0}.stage.entering .grid-wrap{transform:translate(-50%,-50%) rotate(0) scale(1)}
    .stage.entering .tile:not(.hero){opacity:0;filter:blur(8px);transform:translate3d(var(--outx,0),var(--outy,0),0) scale(.72)}
    .stage.entering .tile.hero{position:fixed;inset:0!important;width:100vw!important;height:100vh!important;translate:0 0!important;border-radius:0;transform:none!important;transition:all .85s cubic-bezier(.7,0,.2,1)}
    .stage.entering .tile.hero img{transform:scale(1.01);filter:brightness(.72)}
    .stage.done{opacity:0;visibility:hidden;transition:opacity .55s .75s ease,visibility 0s 1.3s}
    @keyframes brandIn{to{opacity:1;transform:translateY(0) scale(1)}}
    @media(max-width:760px){.grid-wrap{width:225vw;height:120vh}.grid{grid-template-columns:repeat(5,1fr);gap:2vw}.tile:nth-child(n+26){display:none}.brand-card{width:min(88vw,560px);border-radius:20px;padding:24px 22px}.note{bottom:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.grid-wrap{transform:translate(-50%,-50%);}.tile{transform:none!important}}
  </style>
</head>
<body>
  <section class="home" id="home" aria-hidden="true"><div><h2>IED Learning Hub</h2><p>The real homepage would appear here, with the expanded image becoming its hero.</p></div></section>
  <main class="stage" id="stage">
    <div class="grid-wrap" id="gridWrap"><div class="grid" id="grid"></div></div>
    <div class="veil"></div>
    <div class="brand"><div class="brand-card">
      <h1>International<br>Education Department</h1>
      <p class="zh" lang="zh-Hant">國際教育處</p>
      <button class="enter" id="enter">Enter</button>
    </div></div>
    <p class="note">Move your mouse or finger · click Enter to see the transition</p>
  </main>
<script>
  const images=[
    '/images/ied-premium/workspace/luce-chapel-hero.webp',
    '/images/ied-premium/heroes/ied-home-hero.webp',
    '/images/ied-premium/heroes/ied-about-hero.webp',
    '/images/ied-premium/heroes/eep-hero.webp',
    '/images/ied-premium/heroes/esl-hero.webp',
    '/images/ied-premium/heroes/science-hero.webp',
    '/images/ied-premium/heroes/language-arts-hero.webp',
    '/images/ied-premium/heroes/performance-arts-hero.webp',
    '/images/ied-premium/heroes/social-studies-hero.webp',
    '/images/ied-premium/heroes/showcase-hero.webp',
    '/images/ied-premium/cards/ied-home-card.webp',
    '/images/ied-premium/cards/ied-about-card.webp',
    '/images/ied-premium/cards/eep-card.webp',
    '/images/ied-premium/cards/esl-card.webp',
    '/images/ied-premium/cards/science-card.webp',
    '/images/ied-premium/cards/language-arts-card.webp',
    '/images/ied-premium/cards/performance-arts-card.webp',
    '/images/ied-premium/cards/social-studies-card.webp',
    '/images/ied-premium/cards/showcase-card.webp',
    '/images/ied-premium/mobile/ied-home-mobile.webp',
    '/images/ied-premium/mobile/eep-mobile.webp',
    '/images/ied-premium/mobile/esl-mobile.webp'
  ];
  const grid=document.getElementById('grid');
  for(let i=0;i<35;i++){
    const tile=document.createElement('div'); tile.className='tile'+(i===17?' hero':'');
    tile.style.setProperty('--outx',`${(i%7-3)*18}vw`); tile.style.setProperty('--outy',`${(Math.floor(i/7)-2)*22}vh`);
    const img=document.createElement('img'); img.src=images[i%images.length]; img.alt=''; img.loading=i<12?'eager':'lazy';
    tile.appendChild(img); grid.appendChild(tile);
  }
  const wrap=document.getElementById('gridWrap');
  const stage=document.getElementById('stage');
  const home=document.getElementById('home');
  function move(x,y){
    if(stage.classList.contains('entering'))return;
    const nx=x/innerWidth-.5, ny=y/innerHeight-.5;
    wrap.style.transform=`translate(calc(-50% + ${nx*-4.5}vw),calc(-50% + ${ny*-4.5}vh)) rotate(${-4+nx*1.5}deg) scale(1.08)`;
    [...grid.children].forEach((tile,i)=>{const depth=(i%5+1)*2.2;tile.style.setProperty('--tx',`${nx*depth}px`);tile.style.setProperty('--ty',`${ny*depth}px`)});
  }
  addEventListener('pointermove',e=>move(e.clientX,e.clientY),{passive:true});
  document.getElementById('enter').addEventListener('click',()=>{
    stage.classList.add('entering'); home.classList.add('show'); home.setAttribute('aria-hidden','false');
    setTimeout(()=>stage.classList.add('done'),900);
  });
</script>
</body>
</html>
